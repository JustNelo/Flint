<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a14"/>
      <stop offset="1" stop-color="#120d0a"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.40" r="0.62">
      <stop offset="0" stop-color="#e8572a" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#e8572a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#e8572a"/>
    </linearGradient>
  </defs>

  <!-- Rounded charcoal tile with an ember glow -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#ember)"/>

  <!-- Flint shard, centered (source viewBox 72, shard center ~36,34) -->
  <g transform="translate(512 520) scale(11.6) translate(-36 -34)">
    <!-- Shadowed face -->
    <polygon points="28,20 42,38 50,56 22,60 14,32" fill="#2a1a14"/>
    <!-- Lit face -->
    <polygon points="36,8 58,28 42,38 28,20" fill="url(#lit)"/>
    <!-- Outline -->
    <polygon points="36,8 58,28 50,56 22,60 14,32" fill="none" stroke="#e8572a" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
</svg>
