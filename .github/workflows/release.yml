name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    environment: Tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # pdfium binaries are downloaded at build time rather than tracked in git
      # (each is ~6 MB and bumps the repo size on every pdfium version bump).
      # Both binaries must exist on every runner because tauri.conf.json lists
      # them in bundle.resources unconditionally — the build-script verifies
      # presence regardless of the target platform.
      # Source: https://github.com/bblanchon/pdfium-binaries
      - name: Fetch pdfium binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources

          if [ ! -f "src-tauri/resources/pdfium.dll" ]; then
            echo "Fetching pdfium.dll..."
            curl -sL -o "$RUNNER_TEMP/pdfium-win.tgz" \
              "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz"
            mkdir -p "$RUNNER_TEMP/win"
            tar -xzf "$RUNNER_TEMP/pdfium-win.tgz" -C "$RUNNER_TEMP/win"
            cp "$RUNNER_TEMP/win/bin/pdfium.dll" src-tauri/resources/pdfium.dll
          fi

          if [ ! -f "src-tauri/resources/libpdfium.so" ]; then
            echo "Fetching libpdfium.so..."
            curl -sL -o "$RUNNER_TEMP/pdfium-linux.tgz" \
              "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
            mkdir -p "$RUNNER_TEMP/linux"
            tar -xzf "$RUNNER_TEMP/pdfium-linux.tgz" -C "$RUNNER_TEMP/linux"
            cp "$RUNNER_TEMP/linux/lib/libpdfium.so" src-tauri/resources/libpdfium.so
          fi

          ls -la src-tauri/resources/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust lint (clippy + fmt)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Rust-ine v__VERSION__"
          releaseBody: "See the assets below to download and install Rust-ine."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
