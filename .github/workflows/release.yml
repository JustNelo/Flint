name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Run the full CI suite (both OSes) first, so a tag can never produce a
  # release from code that doesn't pass every check.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & release (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    environment: Tauri
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-flint

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Flint v__VERSION__"
          releaseBody: "See the assets below to download and install Flint."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
