name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    environment: Tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # pdfium binaries are downloaded at build time rather than tracked in git
      # (each is ~6 MB and bumps the repo size on every pdfium version bump).
      # Source: https://github.com/bblanchon/pdfium-binaries
      - name: Fetch pdfium.dll (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dest = "src-tauri/resources/pdfium.dll"
          if (Test-Path $dest) {
            Write-Host "pdfium.dll already present, skipping download."
          } else {
            New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
            $tmp = Join-Path $env:RUNNER_TEMP "pdfium-win.tgz"
            Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile $tmp
            tar -xzf $tmp -C $env:RUNNER_TEMP
            Copy-Item -Path (Join-Path $env:RUNNER_TEMP "bin/pdfium.dll") -Destination $dest
            Write-Host "pdfium.dll fetched -> $dest"
          }

      - name: Fetch libpdfium.so (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          dest="src-tauri/resources/libpdfium.so"
          if [ -f "$dest" ]; then
            echo "libpdfium.so already present, skipping download."
          else
            mkdir -p src-tauri/resources
            tmp="$RUNNER_TEMP/pdfium-linux.tgz"
            curl -sL -o "$tmp" "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
            tar -xzf "$tmp" -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/lib/libpdfium.so" "$dest"
            echo "libpdfium.so fetched -> $dest"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust lint (clippy + fmt)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Rust-ine v__VERSION__"
          releaseBody: "See the assets below to download and install Rust-ine."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
